<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ACID GOBLIN // TRIP ENGINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nabla&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #05010a; overflow: hidden;
    font-family: 'Courier New', monospace;
    touch-action: none; -webkit-user-select: none; user-select: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; }

  #hint {
    position: fixed; left: 0; right: 0; bottom: 22px;
    text-align: center; color: #fff; opacity: 0.75;
    font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase;
    pointer-events: none;
    text-shadow: 0 0 8px #000, 0 0 16px #f0f;
    transition: opacity 0.6s ease;
  }
  #hint.hidden { opacity: 0; }

  #splashTitle {
    text-align: center;
    padding: 0 10px;
    line-height: 1.2;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 10px rgba(255,0,220,0.5)) drop-shadow(0 0 18px rgba(0,230,255,0.35));
    animation: pulseTitle 4s ease-in-out infinite;
  }
  .tchar {
    display: inline-block;
    font-family: 'Nabla', cursive;
    font-variation-settings: 'EDPT' 100, 'EHLT' 24;
    font-size: clamp(24px, 6.5vw, 44px);
    margin: 0 0.01em;
    background: linear-gradient(90deg, #ff2fd0, #ffd23f, #2fe8ff, #ff2fd0);
    background-size: 300% auto;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    -webkit-text-stroke: 0.5px rgba(255,255,255,0.22);
    animation: waveChar 2.8s ease-in-out infinite, hueTravel 6s linear infinite;
    animation-delay: var(--d, 0s), var(--d, 0s);
  }
  @keyframes waveChar {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-7px) rotate(-3deg); }
  }
  @keyframes pulseTitle {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 0.85; }
  }
  @keyframes hueTravel {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  #muteBtn, #bgBtn {
    position: fixed; top: 14px; z-index: 10;
    width: 46px; height: 46px; border-radius: 50%;
    border: none; background: transparent; padding: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    mix-blend-mode: screen;
    filter: drop-shadow(0 0 6px rgba(255,0,220,0.5)) drop-shadow(0 0 10px rgba(0,230,255,0.35));
    transition: opacity 1.8s ease, transform 0.2s ease;
  }
  #muteBtn svg, #bgBtn svg { width: 26px; height: 26px; display: block; }
  #muteBtn { right: 10px; }
  #bgBtn { right: 58px; }
  #muteBtn:active, #bgBtn:active { transform: scale(0.88); }
  #muteBtn.idle, #bgBtn.idle { opacity: 0.16; }
  #muteBtn .eyeSlash { transition: stroke-dashoffset 0.25s ease; }
  #muteBtn.muted .eyeSlash { stroke-dashoffset: 0; }
  #muteBtn.muted .eyePupil { opacity: 0.25; }
  #bgBtn svg { transition: transform 0.6s ease; }
  #bgBtn:active svg { transform: rotate(35deg); }

  #loading {
    position: fixed; inset: 0; background: #05010a;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; color: #fff; z-index: 20;
    transition: opacity 0.5s ease;
  }
  #loading .bar {
    width: 200px; height: 4px; background: rgba(255,255,255,0.15);
    margin-top: 14px; border-radius: 2px; overflow: hidden;
  }
  #loading .fill {
    height: 100%; width: 0%; background: linear-gradient(90deg, #0ff, #f0f, #ff0);
    transition: width 0.2s ease;
  }
  #loading .txt {
    letter-spacing: 0.25em; font-size: 12px; text-transform: uppercase; opacity: 0.8;
  }
  #loading .err {
    margin-top: 16px; color: #f66; font-size: 11px; letter-spacing: 0.08em;
    max-width: 320px; text-align: center; text-transform: none; display: none;
  }
</style>
</head>
<body>

<div id="loading">
  <div id="splashTitle" aria-label="Acid Goblin, Trip Engine">ACID GOBLIN &middot; TRIP ENGINE</div>
  <div class="txt">summoning the goblin</div>
  <div class="bar"><div class="fill" id="loadFill"></div></div>
  <div class="err" id="loadErr"></div>
</div>

<canvas id="gl"></canvas>
<div id="hint">touch to spark a little heat. hold and drag to melt it. more fingers, more madness.</div>

<button id="bgBtn" aria-label="change background">
  <svg viewBox="0 0 36 36">
    <defs>
      <linearGradient id="bgIconGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ff2fd0"/>
        <stop offset="50%" stop-color="#ffd23f"/>
        <stop offset="100%" stop-color="#2fe8ff"/>
      </linearGradient>
    </defs>
    <path d="M18 18 m 0 -2.6 a 2.6 2.6 0 1 1 -2.6 2.6 a 6 6 0 1 1 6 -6 a 10.2 10.2 0 1 1 -10.2 10.2 a 14.5 14.5 0 1 1 14.5 -14.5"
          fill="none" stroke="url(#bgIconGrad)" stroke-width="2.2" stroke-linecap="round"/>
  </svg>
</button>
<button id="muteBtn" aria-label="toggle sound">
  <svg viewBox="0 0 36 36">
    <defs>
      <linearGradient id="muteIconGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ff2fd0"/>
        <stop offset="50%" stop-color="#ffd23f"/>
        <stop offset="100%" stop-color="#2fe8ff"/>
      </linearGradient>
    </defs>
    <path class="eyeLid" d="M3 18 C 9 7, 27 7, 33 18 C 27 29, 9 29, 3 18 Z"
          fill="none" stroke="url(#muteIconGrad)" stroke-width="2.2"/>
    <circle class="eyePupil" cx="18" cy="18" r="5" fill="url(#muteIconGrad)"/>
    <line class="eyeSlash" x1="4" y1="4" x2="32" y2="32"
          stroke="url(#muteIconGrad)" stroke-width="2.4" stroke-linecap="round"
          stroke-dasharray="40" stroke-dashoffset="40"/>
  </svg>
</button>

<script>
(function () {
  var el = document.getElementById('splashTitle');
  var text = el.textContent;
  el.textContent = '';
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (ch === ' ') { el.appendChild(document.createTextNode(' ')); continue; }
    var span = document.createElement('span');
    span.className = 'tchar';
    span.textContent = ch;
    span.style.setProperty('--d', (i * 0.09) + 's');
    el.appendChild(span);
  }
})();
</script>

<script src="bg-data.js"></script>
<script>
(function () {
"use strict";

/* ---------------------------------------------------------------------
   ACID GOBLIN: TRIP ENGINE

   Idle: the 10 backgrounds crossfade gently, untouched, just pretty.
   Touch: a localized "madness zone" grows around each finger -- small
   and mild at first touch, escalating into full kaleidoscope/chromatic-
   aberration/feedback-trail chaos the longer and harder (more fingers)
   you touch. Let go and the zone cools back down to the plain artwork.
   Paired with a per-finger TB-303-style acid synth (Web Audio).

   BG_DATA (the 10 background images as base64 data URIs) is loaded from
   the sibling bg-data.js file so this stays a plain double-clickable
   two-file app -- no server, no file:// texture-loading restrictions.
--------------------------------------------------------------------- */

if (typeof BG_DATA === 'undefined' || !BG_DATA.length) {
  showFatal('bg-data.js did not load. Keep it next to index.html.');
  return;
}
const BG_COUNT = BG_DATA.length;

const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl', { antialias: false, preserveDrawingBuffer: false, alpha: false })
        || canvas.getContext('experimental-webgl');

if (!gl) {
  showFatal('This goblin needs WebGL. Try a different browser.');
  return;
}

function showFatal(msg) {
  const el = document.getElementById('loadErr');
  if (el) { el.textContent = msg; el.style.display = 'block'; }
  console.error('[trip-engine]', msg);
}

/* ---------------- shaders ---------------- */

const VERT_SRC = `
attribute vec2 a_pos;
varying vec2 v_uv;
void main() {
  v_uv = a_pos * 0.5 + 0.5;
  gl_Position = vec4(a_pos, 0.0, 1.0);
}
`;

const MAX_ZONES = 8;

const MAIN_FRAG_SRC = `
precision highp float;
varying vec2 v_uv;

uniform sampler2D u_bgA;
uniform sampler2D u_bgB;
uniform sampler2D u_bgNext; // the upcoming background, for the long-hold portal
uniform sampler2D u_prev;
uniform float u_bgMix;
uniform float u_time;
uniform float u_aspect;
uniform float u_imgAspect;

uniform int u_zoneCount;
uniform vec2 u_zonePos[${MAX_ZONES}];    // normalized 0..1, y-up
uniform float u_zoneRadius[${MAX_ZONES}];
uniform float u_zoneHeat[${MAX_ZONES}];  // 0..1, how "cooked" this zone is
uniform float u_zoneHeld[${MAX_ZONES}];  // seconds continuously held
uniform float u_zoneCommitted[${MAX_ZONES}]; // 1 once this zone has stepped through a portal

uniform vec2 u_commitPos;
uniform float u_commitRadius;
uniform float u_commitAmt;
uniform float u_commitProgress; // 0..1 raw time through the commit wipe

vec3 hueRotate(vec3 c, float a) {
  float u = cos(a), w = sin(a);
  mat3 m = mat3(
    0.299 + 0.701*u + 0.168*w,  0.587 - 0.587*u + 0.330*w,  0.114 - 0.114*u - 0.497*w,
    0.299 - 0.299*u - 0.328*w,  0.587 + 0.413*u + 0.035*w,  0.114 - 0.114*u + 0.292*w,
    0.299 - 0.300*u + 1.250*w,  0.587 - 0.588*u - 1.050*w,  0.114 + 0.886*u - 0.203*w
  );
  return clamp(m * c, 0.0, 1.0);
}

vec2 aspectDelta(vec2 a, vec2 b) {
  vec2 d = a - b;
  d.x *= u_aspect;
  return d;
}

// the art is a fixed 819x1024 (0.8) portrait image; without this, uv 0..1
// maps straight onto whatever aspect the canvas has and the art stretches
// (skews) to fit. This crops like CSS background-size: cover instead.
vec2 coverUV(vec2 uv) {
  vec2 span = (u_aspect > u_imgAspect)
    ? vec2(1.0, u_imgAspect / u_aspect)
    : vec2(u_aspect / u_imgAspect, 1.0);
  // tiny extra zoom-in so the ambient/zone UV wobble always lands inside
  // the clamped image, never revealing a stray sliver of the true edge
  span *= 0.965;
  return (uv - 0.5) * span + 0.5;
}

// a smooth, low-frequency field so different patches of the screen drift
// at different speeds instead of one uniform rate everywhere -- some
// pockets sit slow and lazy, others wobble faster, and it shifts which is
// which very slowly over time so it's never a fixed map.
float ambientRate(vec2 uv, float t) {
  float n = sin(uv.x * 2.6 + uv.y * 1.7 + t * 0.02) * 0.5
          + cos(uv.x * 1.1 - uv.y * 2.9 - t * 0.015) * 0.5;
  return mix(0.35, 2.0, n * 0.5 + 0.5);
}

// always-on heat-haze over the idle (untouched) artwork: a big slow wave
// layered with a smaller faster ripple (real heat-shimmer has both), plus
// a shared scalar so color can visibly pulse in sync with the same wave
// as it passes over -- not just the UV displacement.
vec2 ambientWobble(vec2 uv, float t) {
  float rate = ambientRate(uv, t);
  float wx = sin(t * 0.35 * rate + uv.y * 4.0) + 0.5 * sin(t * 0.9 * rate + uv.y * 11.0);
  float wy = cos(t * 0.27 * rate + uv.x * 4.0) + 0.5 * cos(t * 0.8 * rate + uv.x * 11.0);
  return uv + vec2(wx, wy) * 0.011;
}
float ambientWave(vec2 uv, float t) {
  float rate = ambientRate(uv, t);
  return sin(t * 0.35 * rate + uv.y * 4.0) * cos(t * 0.27 * rate + uv.x * 4.0);
}

void main() {
  vec2 uv0 = v_uv;

  // union weirdness mask across all zones, and track the strongest one
  // (that's the zone whose local warp we actually apply). GLSL ES 1.0
  // fragment shaders can't index a uniform array by a runtime variable,
  // so the "best" zone's data is captured directly inside the loop.
  float w = 0.0;
  float bestMask = 0.0;
  vec2 bestPos = vec2(0.5);
  float bestRadius = 0.1;
  float bestHeatVal = 0.0;
  float bestHeld = 0.0;
  float bestCommitted = 0.0;
  for (int i = 0; i < ${MAX_ZONES}; i++) {
    if (i >= u_zoneCount) break;
    vec2 zp = u_zonePos[i];
    float zr = max(u_zoneRadius[i], 0.001);
    float zh = u_zoneHeat[i];
    float d = length(aspectDelta(uv0, zp));
    float m = smoothstep(zr, 0.0, d) * zh;
    w = 1.0 - (1.0 - w) * (1.0 - m);
    if (m > bestMask) { bestMask = m; bestPos = zp; bestRadius = zr; bestHeatVal = zh; bestHeld = u_zoneHeld[i]; bestCommitted = u_zoneCommitted[i]; }
  }
  w = clamp(w, 0.0, 1.0);

  vec2 weirdUV = uv0;
  float localHeat = 0.0;

  if (bestMask > 0.001) {
    vec2 zp = bestPos;
    float zr = bestRadius;
    localHeat = bestHeatVal;

    vec2 rel = aspectDelta(uv0, zp);
    float d = length(rel);
    float edgeFall = smoothstep(zr, 0.0, d);

    // melt wobble, grows with heat -- slowed way down (was 26.0/3.2) so
    // it reads as a slow melt rather than a fast, flickery ripple
    float wob = localHeat * 0.16 * sin(d * 14.0 - u_time * 1.1) * edgeFall;
    rel += normalize(rel + 1e-5) * wob;
    d = length(rel);

    // local swirl, grows with heat
    float swirlAmt = mix(0.2, 2.6, localHeat) * edgeFall;
    float ca = cos(swirlAmt), sa = sin(swirlAmt);
    rel = mat2(ca, -sa, sa, ca) * rel;

    // kaleidoscope fold, segment count grows with heat -- capped lower
    // (was 9.0) since a high, fast-changing segment count is what makes
    // the fold pattern pop/flicker as heat decays
    float segs = mix(1.2, 5.5, localHeat);
    float ang = atan(rel.y, rel.x);
    float seg = 6.28318530718 / max(segs, 1.0);
    float am = mod(ang, seg);
    am = abs(am - seg * 0.5);
    vec2 folded = vec2(cos(am), sin(am)) * length(rel);
    folded.x /= u_aspect;

    weirdUV = mix(uv0, zp + folded, edgeFall);
  }

  // chromatic aberration, only where currently weird
  vec2 abDir = normalize(weirdUV - 0.5 + 1e-5);
  float abAmt = mix(0.0, 0.022, localHeat) * w;
  vec2 uvR = weirdUV + abDir * abAmt;
  vec2 uvG = weirdUV;
  vec2 uvB = weirdUV - abDir * abAmt;

  float r = mix(texture2D(u_bgA, coverUV(uvR)).r, texture2D(u_bgB, coverUV(uvR)).r, u_bgMix);
  float g = mix(texture2D(u_bgA, coverUV(uvG)).g, texture2D(u_bgB, coverUV(uvG)).g, u_bgMix);
  float b = mix(texture2D(u_bgA, coverUV(uvB)).b, texture2D(u_bgB, coverUV(uvB)).b, u_bgMix);
  vec3 weirdCol = vec3(r, g, b);
  weirdCol = hueRotate(weirdCol, localHeat * (u_time * 0.22 + bestMask * 0.8));

  vec2 idleUV = ambientWobble(uv0, u_time);
  vec3 cleanCol = mix(texture2D(u_bgA, coverUV(idleUV)).rgb, texture2D(u_bgB, coverUV(idleUV)).rgb, u_bgMix);
  float shimmer = ambientWave(uv0, u_time);
  cleanCol = hueRotate(cleanCol, shimmer * 0.16 + sin(u_time * 0.05) * 0.05 + sin(u_time * 0.033 + 1.7) * 0.03);
  cleanCol *= 1.0 + shimmer * 0.09;

  vec3 col = mix(cleanCol, weirdCol, w);

  // feedback trail: a short local after-image, sampled in place (no
  // drift/rotation) so it can never smear a vortex around the canvas --
  // only inside currently-weird pixels, so idle areas never ghost
  vec3 prevCol = texture2D(u_prev, v_uv).rgb;
  float fb = w * mix(0.0, 0.65, localHeat);
  col = mix(col, prevCol, fb);

  // long-hold "portal": past ~5s held in one spot, a torn window opens
  // right there showing the next background underneath, growing until
  // ~9s. Experimental -- drawn on top of everything else so it reads
  // clearly as a window rather than blending into the melt around it.
  float portalAmt = smoothstep(5.0, 9.0, bestHeld) * (1.0 - bestCommitted);
  if (portalAmt > 0.001) {
    vec2 prel = aspectDelta(uv0, bestPos);
    float pang = atan(prel.y, prel.x);
    float tear = sin(pang * 9.0 + u_time * 1.6) * 0.028 + sin(pang * 23.0 - u_time * 2.3) * 0.014;
    float pr = mix(0.0, 0.2, portalAmt) + tear * portalAmt;
    float pd = length(prel) - pr;
    float portalMask = smoothstep(0.035, -0.035, pd) * portalAmt;

    // the peek shouldn't read as a perfectly still photo -- a slow wobble
    // and a gentle hue drift specific to the portal, distinct from the
    // idle heat-haze so it feels like its own small pocket of weather
    vec2 pw = vec2(sin(u_time * 0.6 + uv0.y * 8.0), cos(u_time * 0.5 + uv0.x * 8.0)) * 0.012;
    vec3 nextCol = texture2D(u_bgNext, coverUV(uv0 + pw)).rgb;
    nextCol = hueRotate(nextCol, sin(u_time * 0.4 + pang * 1.3) * 0.22);

    col = mix(col, nextCol, portalMask);
  }

  // stepping through: once committed, the peek above (u_bgNext) keeps
  // drifting to whatever comes after the *new* current, so it can't be
  // trusted to still match what the maker just saw -- this wipe instead
  // targets u_bgB directly, which changeBackground() freezes to exactly
  // the committed image, and grows from the release point to swallow the
  // screen as a trippy torn dissolve rather than a hard cut.
  if (u_commitAmt > 0.001) {
    vec2 crel = aspectDelta(uv0, u_commitPos);
    float cang = atan(crel.y, crel.x);
    float ctear = sin(cang * 9.0 + u_time * 1.6) * 0.05 + sin(cang * 23.0 - u_time * 2.3) * 0.025;
    float cd = length(crel) - u_commitRadius - ctear;
    float cMask = smoothstep(0.06, -0.06, cd) * u_commitAmt;

    // wobble/hue/blur all peak mid-wipe and settle back to *zero* by the
    // end (not just fade out with the mask) -- so the revealed image is
    // already sharp and true-colour before this layer disappears, instead
    // of snapping into focus the instant it does. A wide smoothstep hump
    // (not a sharp sine peak) so the fuzz itself fades in and out slowly
    // rather than rushing through its middle.
    float cp = clamp(u_commitProgress, 0.0, 1.0);
    float distortAmt = smoothstep(0.0, 0.4, cp) * (1.0 - smoothstep(0.6, 1.0, cp));
    vec2 cw = vec2(sin(u_time * 0.7 + uv0.y * 9.0), cos(u_time * 0.55 + uv0.x * 9.0)) * 0.018 * distortAmt;
    float blurAmt = distortAmt * 0.016;

    vec3 throughCol = texture2D(u_bgB, coverUV(uv0 + cw)).rgb;
    throughCol += texture2D(u_bgB, coverUV(uv0 + cw + vec2(blurAmt, 0.0))).rgb;
    throughCol += texture2D(u_bgB, coverUV(uv0 + cw - vec2(blurAmt, 0.0))).rgb;
    throughCol += texture2D(u_bgB, coverUV(uv0 + cw + vec2(0.0, blurAmt))).rgb;
    throughCol += texture2D(u_bgB, coverUV(uv0 + cw - vec2(0.0, blurAmt))).rgb;
    throughCol *= 0.2;
    throughCol = hueRotate(throughCol, sin(u_time * 0.5 + cang * 1.6) * 0.4 * distortAmt);

    col = mix(col, throughCol, cMask);
  }

  // gentle vignette, always present, not part of the "weird" system
  float dist0 = length(v_uv - 0.5);
  float vig = smoothstep(0.95, 0.35, dist0);
  col *= mix(0.85, 1.02, vig);

  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
`;

const BLIT_FRAG_SRC = `
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_tex;
uniform float u_grain;
uniform float u_time;
float hash(vec2 p){ return fract(sin(dot(p, vec2(41.3,289.1))) * 43758.5453); }
void main() {
  vec3 c = texture2D(u_tex, v_uv).rgb;
  float n = (hash(v_uv * u_time * 60.0) - 0.5) * u_grain;
  c += n;
  gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
}
`;

function compile(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(sh));
    throw new Error('shader compile failed');
  }
  return sh;
}
function link(vsSrc, fsSrc) {
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(prog));
    throw new Error('program link failed');
  }
  return prog;
}

let mainProg, blitProg;
try {
  mainProg = link(VERT_SRC, MAIN_FRAG_SRC);
  blitProg = link(VERT_SRC, BLIT_FRAG_SRC);
} catch (ex) {
  showFatal('Shader setup failed: ' + ex.message);
  return;
}

const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

function bindQuad(prog) {
  const loc = gl.getAttribLocation(prog, 'a_pos');
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
}

/* ---------------- framebuffers (ping-pong for feedback) ---------------- */

let fboW = 2, fboH = 2;
let fbos = [null, null];
let fboTex = [null, null];
let pingIndex = 0;

function makeFBOTarget(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { fb, tex };
}

function rebuildFBOs() {
  const scale = Math.min(1, 900 / Math.max(window.innerWidth, window.innerHeight));
  fboW = Math.max(2, Math.floor(window.innerWidth * scale * (window.devicePixelRatio > 1 ? 0.85 : 1)));
  fboH = Math.max(2, Math.floor(window.innerHeight * scale * (window.devicePixelRatio > 1 ? 0.85 : 1)));
  for (let i = 0; i < 2; i++) {
    const t = makeFBOTarget(fboW, fboH);
    fbos[i] = t.fb;
    fboTex[i] = t.tex;
  }
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  rebuildFBOs();
}
window.addEventListener('resize', resize);

/* ---------------- load background textures (from embedded base64) ---------------- */

const textures = [];
let loadedCount = 0;
let failedCount = 0;
let fallbackTex = null;
let imgAspect = 0.8; // real value captured from the first image that loads

function makeFallbackTexture() {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  const px = new Uint8Array([20, 4, 24, 255]);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, px);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  return tex;
}

function loadTexture(dataUri) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let tex = null;
      try {
        if (img.naturalWidth && img.naturalHeight) {
          imgAspect = img.naturalWidth / img.naturalHeight;
        }
        tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      } catch (ex) {
        console.warn('[trip-engine] texture upload failed', ex);
        tex = null;
      }
      loadedCount++;
      if (!tex) failedCount++;
      document.getElementById('loadFill').style.width = (loadedCount / BG_COUNT * 100) + '%';
      resolve(tex);
    };
    img.onerror = () => {
      loadedCount++; failedCount++;
      document.getElementById('loadFill').style.width = (loadedCount / BG_COUNT * 100) + '%';
      resolve(null);
    };
    img.src = dataUri;
  });
}

/* ---------------- touch / pointer state ---------------- */

const pointers = new Map(); // id -> {x,y (0..1 y-up), px, py, speed, downTime}
let zones = []; // {id, x, y, heat, active}

function clamp01(v, fallback) {
  return Number.isFinite(v) ? Math.max(0, Math.min(1, v)) : fallback;
}
function normFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  const w = rect.width || 1, h = rect.height || 1;
  const x = clamp01((e.clientX - rect.left) / w, 0.5);
  const y = clamp01(1.0 - (e.clientY - rect.top) / h, 0.5); // y-up for shader
  return { x, y };
}
function getZone(id) { return zones.find(z => z.id === id); }

function onPointerDown(e) {
  ensureAudio();
  const { x, y } = normFromEvent(e);
  pointers.set(e.pointerId, { x, y, px: x, py: y, speed: 0, downTime: performance.now() });
  // reuse an existing zone for this id if one is still around (defensive
  // against duplicate/re-fired down events with no matching up) instead
  // of ever accumulating orphaned zones
  const existing = getZone(e.pointerId);
  // every touch starts with a real punch (not a slow ramp from near-zero)
  // so a plain tap is clearly felt in its own spot; holding still builds
  // further from there exactly as before.
  const TAP_PUNCH = 0.45;
  if (existing) {
    existing.x = x; existing.y = y; existing.active = true;
    existing.heat = Math.max(existing.heat, TAP_PUNCH);
    existing.heldFor = 0;
  } else {
    zones.push({ id: e.pointerId, x, y, heat: TAP_PUNCH, active: true, heldFor: 0 });
  }
  synthNoteOn(e.pointerId, x, y);
  document.getElementById('hint').classList.add('hidden');
  e.preventDefault();
}
function onPointerMove(e) {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const { x, y } = normFromEvent(e);
  p.px = p.x; p.py = p.y;
  p.x = x; p.y = y;
  const dx = p.x - p.px, dy = p.y - p.py;
  p.speed = Math.min(1, Math.sqrt(dx*dx + dy*dy) * 18);
  const z = getZone(e.pointerId);
  if (z) { z.x = x; z.y = y; }
  synthNoteUpdate(e.pointerId, x, y, p.speed);
  e.preventDefault();
}
// how long a hold's portal (see the shader's portalAmt) has to have been
// open before letting go actually steps through to the next background;
// matches the shader's portalAmt ramp (smoothstep 5.0 -> 9.0)
const PORTAL_COMMIT = 7.5;
// drives the full-screen "step through" wipe once committed (see draw());
// deliberately independent of any zone/heldFor bookkeeping so it can't
// drift onto a different image than what the maker actually saw open
let portalCommit = null; // {x, y, startTime}
const COMMIT_DURATION = 3400; // ms -- slower wash so stepping through lingers

function onPointerUp(e) {
  pointers.delete(e.pointerId);
  const z = getZone(e.pointerId);
  if (z) {
    if ((z.heldFor || 0) > PORTAL_COMMIT) {
      portalCommit = { x: z.x, y: z.y, startTime: performance.now() };
      changeBackground();
      // only suppress the old live peek (it would drift onto the wrong
      // image once bgIndexB moves -- see the shader's portalAmt); the
      // kaleidoscope/melt itself keeps decaying at its normal slow rate
      // instead of snapping off, so it doesn't disappear the instant you
      // let go, it fades out alongside the commit wipe.
      z.committed = true;
    }
    z.active = false;
  }
  synthNoteOff(e.pointerId);
  e.preventDefault();
}

canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
canvas.addEventListener('pointermove', onPointerMove, { passive: false });
canvas.addEventListener('pointerup', onPointerUp, { passive: false });
canvas.addEventListener('pointercancel', onPointerUp, { passive: false });
canvas.addEventListener('pointerleave', onPointerUp, { passive: false });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

/* ---------------- buttons fade to near-nothing when idle ---------------- */

(function () {
  const IDLE_AFTER = 4200; // ms of no interaction before fading
  const idleEls = [document.getElementById('muteBtn'), document.getElementById('bgBtn')];
  let lastInteract = performance.now();
  function wake() {
    lastInteract = performance.now();
    idleEls.forEach(el => el.classList.remove('idle'));
  }
  window.addEventListener('pointerdown', wake, { passive: true });
  window.addEventListener('pointermove', wake, { passive: true });
  setInterval(() => {
    if (performance.now() - lastInteract > IDLE_AFTER) {
      idleEls.forEach(el => el.classList.add('idle'));
    }
  }, 400);
})();

/* ---------------- audio: per-finger TB-303-ish acid synth ---------------- */

let actx = null;
let masterGain, dryGain, wetGain, delayNode, delayFeedback, delayFilter, limiter, muted = false;
const voices = new Map(); // pointerId -> {osc, filter, shaper, gain, lfo, lfoGain}
// voices past release aren't in `voices` anymore but their nodes keep
// sounding until their scheduled stop -- tracked here so repeated tapping
// can't pile up an unbounded number of overlapping tails (that pileup was
// the actual cause of the "fighting"/reverb/dropout: too many hot voices
// hitting the shared delay feedback bus at once with nothing to cap it).
const releasingVoices = [];
const MAX_RELEASING = 5;

// acid phrygian-ish scale, 2 octaves, semitone offsets from root
const SCALE = [0, 1, 3, 5, 7, 8, 10, 12, 13, 15, 17, 19, 20, 22];
const ROOT_MIDI = 33; // A1

function midiToFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

function makeDistortionCurve(amount) {
  const n = 256;
  const curve = new Float32Array(n);
  const k = amount;
  for (let i = 0; i < n; i++) {
    const x = (i / (n - 1)) * 2 - 1;
    curve[i] = Math.tanh(k * x) / Math.tanh(k);
  }
  return curve;
}

function ensureAudio() {
  if (actx) {
    if (actx.state === 'suspended') actx.resume();
    return;
  }
  actx = new (window.AudioContext || window.webkitAudioContext)();

  masterGain = actx.createGain();
  masterGain.gain.value = 0.85;

  dryGain = actx.createGain();
  dryGain.gain.value = 0.75;
  wetGain = actx.createGain();
  wetGain.gain.value = 0.24;

  delayNode = actx.createDelay(1.0);
  delayNode.delayTime.value = 0.21;
  delayFeedback = actx.createGain();
  delayFeedback.gain.value = 0.3;
  delayFilter = actx.createBiquadFilter();
  delayFilter.type = 'lowpass';
  delayFilter.frequency.value = 2200;

  // a soft limiter on the shared output bus -- with several fingers/taps
  // stacking voices into the same delay feedback loop, the sum can get
  // loud enough to clip; this catches that instead of letting it distort
  // and (on some browsers) choke the audio pipeline entirely.
  limiter = actx.createDynamicsCompressor();
  limiter.threshold.value = -10;
  limiter.knee.value = 12;
  limiter.ratio.value = 12;
  limiter.attack.value = 0.003;
  limiter.release.value = 0.25;
  limiter.connect(actx.destination);

  masterGain.connect(dryGain).connect(limiter);
  masterGain.connect(delayNode);
  delayNode.connect(delayFilter);
  delayFilter.connect(delayFeedback);
  delayFeedback.connect(delayNode);
  delayFilter.connect(wetGain).connect(limiter);
}

function noteFor(x, y, voiceIndex) {
  const yc = clamp01(y, 0.5);
  const idx = Math.floor(yc * SCALE.length) % SCALE.length;
  const octaveShift = (voiceIndex % 3) * 12;
  const midi = ROOT_MIDI + SCALE[idx] + octaveShift;
  return midiToFreq(midi);
}
function cutoffFor(x) {
  const t = clamp01(x, 0.5);
  return 150 * Math.pow(40, t);
}
function safeSetTarget(param, value, now, tc) {
  if (!Number.isFinite(value)) return;
  param.setTargetAtTime(value, now, tc);
}

function synthNoteOn(id, x, y) {
  if (!actx || muted) return;
  const now = actx.currentTime;
  const voiceIndex = voices.size;

  const osc = actx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.value = noteFor(x, y, voiceIndex);
  osc.detune.value = (Math.random() - 0.5) * 12;

  const filter = actx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = cutoffFor(x);
  filter.Q.value = 10;

  const shaper = actx.createWaveShaper();
  shaper.curve = makeDistortionCurve(2.2);
  shaper.oversample = '2x';

  const gain = actx.createGain();
  gain.gain.value = 0.0001;

  const lfo = actx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.value = 3.0;
  const lfoGain = actx.createGain();
  lfoGain.gain.value = 400;
  lfo.connect(lfoGain).connect(filter.frequency);
  lfo.start();

  osc.connect(filter);
  filter.connect(shaper);
  shaper.connect(gain);
  gain.connect(masterGain);

  osc.start();

  // recent-retrigger detection = accent (short time since last note anywhere = punchier)
  const timeSinceLast = now - (synthNoteOn._lastTrigger || -10);
  synthNoteOn._lastTrigger = now;
  const accent = timeSinceLast < 0.18;
  const peak = accent ? 0.34 : 0.22;

  gain.gain.cancelScheduledValues(now);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(peak, now + (accent ? 0.004 : 0.012));

  voices.set(id, { osc, filter, shaper, gain, lfo, lfoGain, voiceIndex });
}

function synthNoteUpdate(id, x, y, speed) {
  if (!actx || muted) return;
  const v = voices.get(id);
  if (!v) return;
  const now = actx.currentTime;
  const freq = noteFor(x, y, v.voiceIndex);
  safeSetTarget(v.osc.frequency, freq, now, 0.03);

  const cutoff = cutoffFor(x);
  const sp = Number.isFinite(speed) ? Math.max(0, Math.min(1, speed)) : 0;
  safeSetTarget(v.filter.frequency, cutoff, now, 0.015);
  safeSetTarget(v.filter.Q, 8 + sp * 20, now, 0.05);

  safeSetTarget(v.lfo.frequency, 1.5 + sp * 14, now, 0.05);
  safeSetTarget(v.lfoGain.gain, 200 + sp * 1400, now, 0.05);
  v.shaper.curve = makeDistortionCurve(1.8 + sp * 4.0);
}

function synthNoteOff(id) {
  const v = voices.get(id);
  if (!v || !actx) return;
  const now = actx.currentTime;
  // deliberately much shorter than the visual heat shimmer's fade: the
  // tone only needs a quick, clean release. Letting it linger as long as
  // the visual (tried that) meant repeated taps stacked many overlapping
  // tails on the shared delay bus at once -- that pileup, not any one
  // voice, was what caused the fighting/reverb/dropout.
  const tau = 0.35;
  v.gain.gain.cancelScheduledValues(now);
  v.gain.gain.setTargetAtTime(0.0001, now, tau);
  const stopAt = now + 1.6;
  v.lfo.stop(stopAt);
  v.osc.stop(stopAt);
  voices.delete(id);

  releasingVoices.push({ gain: v.gain, osc: v.osc, lfo: v.lfo, stopAt });
  // prune anything already past its natural stop, then hard-cap how many
  // releasing tails can overlap at once
  for (let i = releasingVoices.length - 1; i >= 0; i--) {
    if (releasingVoices[i].stopAt <= now) releasingVoices.splice(i, 1);
  }
  while (releasingVoices.length > MAX_RELEASING) {
    const oldest = releasingVoices.shift();
    try {
      oldest.gain.gain.cancelScheduledValues(now);
      oldest.gain.gain.setTargetAtTime(0.0001, now, 0.04);
      oldest.lfo.stop(now + 0.15);
      oldest.osc.stop(now + 0.15);
    } catch (ex) { /* already stopped */ }
  }
}

document.getElementById('muteBtn').addEventListener('click', () => {
  muted = !muted;
  document.getElementById('muteBtn').classList.toggle('muted', muted);
  if (masterGain) masterGain.gain.setTargetAtTime(muted ? 0 : 0.85, actx.currentTime, 0.05);
});

/* ---------------- uniforms setup ---------------- */

function getUniforms(prog, names) {
  const u = {};
  names.forEach(n => { u[n] = gl.getUniformLocation(prog, n); });
  return u;
}

const mainU = getUniforms(mainProg, [
  'u_bgA', 'u_bgB', 'u_bgNext', 'u_prev', 'u_bgMix', 'u_time', 'u_aspect', 'u_imgAspect',
  'u_zoneCount', 'u_zonePos', 'u_zoneRadius', 'u_zoneHeat', 'u_zoneHeld', 'u_zoneCommitted',
  'u_commitPos', 'u_commitRadius', 'u_commitAmt', 'u_commitProgress'
]);
const blitU = getUniforms(blitProg, ['u_tex', 'u_grain', 'u_time']);

/* ---------------- main loop ---------------- */

let bgIndexA = 0, bgIndexB = 0, bgMix = 1;
let lastFrameTime = performance.now();

function changeBackground() {
  bgIndexA = bgIndexB;
  bgIndexB = (bgIndexB + 1) % BG_COUNT;
  bgMix = 0;
}
document.getElementById('bgBtn').addEventListener('click', changeBackground);

function draw() {
  requestAnimationFrame(draw);
  if (loadedCount < BG_COUNT) return;

  const now = performance.now();
  const time = now * 0.001;
  const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
  lastFrameTime = now;

  // zone heat: grows while held (faster with drag speed and with more
  // simultaneous fingers), cools down once released. heldFor tracks plain
  // continuous hold time (seconds), separate from heat, so a long single
  // hold can slowly take over the whole screen past OVERTAKE_START.
  const OVERTAKE_START = 5.0;
  const OVERTAKE_FULL = 12.0;
  const activeCount = zones.reduce((n, z) => n + (z.active ? 1 : 0), 0);
  zones.forEach(z => {
    if (z.active) {
      const p = pointers.get(z.id);
      const speed = p ? p.speed : 0;
      const gainRate = (0.32 + speed * 2.4) * (1 + 0.35 * Math.max(0, activeCount - 1));
      z.heat = Math.min(1, z.heat + dt * gainRate);
      z.heldFor = (z.heldFor || 0) + dt;
    } else {
      // a touch lingers as a slow-fading heat shimmer rather than
      // snapping off -- exponential decay so this holds true whether
      // the touch was a light tap or a long hold. Deliberately much
      // longer than the paired tone's release (see synthNoteOff) --
      // the visual can linger without the audio-pileup problem sound has.
      z.heat *= Math.exp(-dt / 5.5);
      if (z.heat < 0.003) z.heat = 0;
      z.heldFor = Math.max(0, (z.heldFor || 0) - dt * 2.0);
    }
  });
  zones = zones.filter(z => z.active || z.heat > 0.001);

  const maxHeat = zones.reduce((m, z) => Math.max(m, z.heat), 0);

  // background only changes when triggered (button, or stepping through a
  // portal); this just animates the crossfade once that happens. Slow
  // enough to read as a proper dissolve rather than a snap cut -- the
  // portal-commit case especially looked abrupt at the old faster rate.
  bgMix = Math.min(1, bgMix + 0.01);

  // zone uniforms: strongest MAX_ZONES by heat
  const sortedZones = zones.slice().sort((a, b) => b.heat - a.heat).slice(0, MAX_ZONES);
  const zonePos = new Float32Array(MAX_ZONES * 2);
  const zoneRadius = new Float32Array(MAX_ZONES);
  const zoneHeat = new Float32Array(MAX_ZONES);
  const zoneHeld = new Float32Array(MAX_ZONES);
  const zoneCommitted = new Float32Array(MAX_ZONES);
  sortedZones.forEach((z, i) => {
    zonePos[i*2] = z.x; zonePos[i*2+1] = z.y;
    const t = Math.max(0, Math.min(1, ((z.heldFor || 0) - OVERTAKE_START) / (OVERTAKE_FULL - OVERTAKE_START)));
    const overtake = t * t * (3 - 2 * t); // smoothstep
    zoneRadius[i] = 0.07 + 0.36 * z.heat + overtake * 1.6; // little section -> big weird -> whole screen
    zoneHeat[i] = z.heat;
    zoneHeld[i] = z.heldFor || 0;
    zoneCommitted[i] = z.committed ? 1 : 0;
  });

  const aspect = canvas.width / Math.max(1, canvas.height);

  // --- pass 1: render effect into ping FBO, reading from pong as previous frame ---
  const writeIdx = pingIndex;
  const readIdx = 1 - pingIndex;

  gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[writeIdx]);
  gl.viewport(0, 0, fboW, fboH);
  gl.useProgram(mainProg);
  bindQuad(mainProg);

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, textures[bgIndexA] || fallbackTex);
  gl.uniform1i(mainU.u_bgA, 0);

  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, textures[bgIndexB] || fallbackTex);
  gl.uniform1i(mainU.u_bgB, 1);

  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, fboTex[readIdx]);
  gl.uniform1i(mainU.u_prev, 2);

  // the portal (see main()) always peeks at whatever comes after the
  // currently-settled background, regardless of any crossfade in progress
  const peekIndex = (bgIndexB + 1) % BG_COUNT;
  gl.activeTexture(gl.TEXTURE3);
  gl.bindTexture(gl.TEXTURE_2D, textures[peekIndex] || fallbackTex);
  gl.uniform1i(mainU.u_bgNext, 3);

  gl.uniform1f(mainU.u_bgMix, bgMix);
  gl.uniform1f(mainU.u_time, time);
  gl.uniform1f(mainU.u_aspect, aspect);
  gl.uniform1f(mainU.u_imgAspect, imgAspect);
  gl.uniform1i(mainU.u_zoneCount, sortedZones.length);
  gl.uniform2fv(mainU.u_zonePos, zonePos);
  gl.uniform1fv(mainU.u_zoneRadius, zoneRadius);
  gl.uniform1fv(mainU.u_zoneHeat, zoneHeat);
  gl.uniform1fv(mainU.u_zoneHeld, zoneHeld);
  gl.uniform1fv(mainU.u_zoneCommitted, zoneCommitted);

  // step-through wipe: grows from the release point to swallow the whole
  // screen, then hands off to the (by-then fully crossfaded) background
  let commitAmt = 0, commitX = 0.5, commitY = 0.5, commitRadius = 0, commitProgress = 0;
  if (portalCommit) {
    const ct = Math.min(1, (now - portalCommit.startTime) / COMMIT_DURATION);
    const eased = ct * ct * (3 - 2 * ct);
    commitRadius = 0.2 + eased * 1.6;
    commitAmt = Math.min(1, ct / 0.15) * (1 - Math.min(1, Math.max(0, (ct - 0.7) / 0.3)));
    commitProgress = ct;
    commitX = portalCommit.x; commitY = portalCommit.y;
    if (ct >= 1) portalCommit = null;
  }
  gl.uniform2f(mainU.u_commitPos, commitX, commitY);
  gl.uniform1f(mainU.u_commitRadius, commitRadius);
  gl.uniform1f(mainU.u_commitAmt, commitAmt);
  gl.uniform1f(mainU.u_commitProgress, commitProgress);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  // --- pass 2: blit ping FBO to screen with subtle grain ---
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(blitProg);
  bindQuad(blitProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, fboTex[writeIdx]);
  gl.uniform1i(blitU.u_tex, 0);
  gl.uniform1f(blitU.u_grain, 0.012 + maxHeat * 0.02);
  gl.uniform1f(blitU.u_time, time);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  pingIndex = readIdx;
}

/* ---------------- boot ---------------- */

resize();
fallbackTex = makeFallbackTexture();

Promise.all(BG_DATA.map(loadTexture)).then((texs) => {
  texs.forEach(t => textures.push(t));
  if (failedCount >= BG_COUNT) {
    showFatal('None of the background art could load. Check bg-data.js is intact next to index.html.');
    return;
  }
  if (failedCount > 0) {
    console.warn('[trip-engine]', failedCount, 'of', BG_COUNT, 'backgrounds failed to load; continuing with the rest.');
  }
  document.getElementById('loading').style.opacity = '0';
  setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 500);
  requestAnimationFrame(draw);
});

})();
</script>
</body>
</html>
